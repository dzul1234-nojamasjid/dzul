<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noja Daily Procedure</title>
<style>
  :root {
    --bg:#0f172a; --card:#1e293b; --accent:#22c55e; --accent2:#38bdf8;
    --text:#e2e8f0; --muted:#94a3b8; --warn:#f59e0b; --danger:#ef4444;
    --border:#334155; --input-bg:#0b1220; --gold:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);padding:16px;padding-bottom:120px;line-height:1.5}

  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  .btn-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .btn-lang,.btn-tool{background:var(--border);color:var(--text);border:none;padding:6px 12px;
    border-radius:6px;font-weight:700;font-size:0.8rem;cursor:pointer;width:auto}
  .btn-lang{background:var(--accent2);color:#0f172a}
  .btn-gallery{background:#8b5cf6;color:#fff}
  .btn-log{background:#f97316;color:#fff}
  .btn-sync{background:var(--accent);color:#0f172a}

  .shift-toggle{display:flex;gap:10px;margin-bottom:12px;justify-content:center}
  .shift-btn{background:var(--card);border:2px solid var(--border);color:var(--text);
    padding:10px 20px;border-radius:10px;font-weight:bold;cursor:pointer;transition:.2s}
  .shift-btn.active{background:var(--accent2);color:#0f172a;border-color:var(--accent2)}

  header{text-align:center;margin-bottom:20px;padding:20px 16px;
    background:linear-gradient(135deg,#166534,#065f46);border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
  header h1{margin:0;font-size:1.4rem;letter-spacing:0.5px}
  
  /* Ramadhan Countdown Styling */
  .ramadhan-countdown {
    margin-top: 15px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    border: 1px solid rgba(251, 191, 36, 0.3);
  }
  .ramadhan-countdown h3 {
    margin: 0 0 5px 0;
    font-size: 0.85rem;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .ramadhan-countdown .days {
    font-size: 1.8rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
  }
  .ramadhan-countdown .days span { font-size: 0.9rem; font-weight: 400; color: var(--text); }

  .date-display{font-size:0.95rem;font-weight:bold;color:#fff;margin-top:12px}
  .clock{font-size:1.5rem;font-weight:700;margin-top:4px;color:#fff;font-variant-numeric:tabular-nums}

  .progress-wrap{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;margin-bottom:8px}
  .progress-bar{height:10px;background:var(--border);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:99px;transition:width .3s}
  .progress-text{text-align:center;font-size:0.8rem;color:var(--muted);margin-top:6px}

  .section{background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden;border:1px solid var(--border)}
  .section-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
    user-select:none;background:#243447;flex-wrap:wrap}
  .section-head .time{background:var(--accent2);color:#0f172a;font-weight:700;font-size:0.72rem;
    padding:3px 8px;border-radius:6px;white-space:nowrap}
  .section-head h2{margin:0;font-size:0.95rem;flex:1}
  .section-head .arrow{transition:transform .25s;color:var(--muted)}
  .section.open .arrow{transform:rotate(90deg)}
  .section-body{display:none;padding:6px 16px 14px}
  .section.open .section-body{display:block}

  .task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #2d3b4f}
  .task:last-child{border-bottom:none}
  .task input[type="checkbox"]{appearance:none;width:22px;height:22px;min-width:22px;
    border:2px solid var(--muted);border-radius:6px;margin-top:2px;cursor:pointer;position:relative;transition:.2s}
  .task input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
  .task input[type="checkbox"]:checked::after{content:"✓";position:absolute;color:#0f172a;
    font-weight:900;font-size:15px;left:4px;top:-2px}
  .task label{flex:1;font-size:0.95rem;cursor:pointer}
  .task input:checked + label{color:var(--muted);text-decoration:line-through}
  .note{font-size:0.8rem;color:var(--warn);margin-top:4px;display:block}

  .edit-input{width:100%;padding:8px;background:var(--input-bg);border:1px solid var(--border);
    color:var(--text);border-radius:6px;font-family:inherit;margin-bottom:4px}
  .btn-sm{padding:6px 10px;font-size:0.75rem;border-radius:6px;cursor:pointer;border:none;font-weight:bold}
  .btn-delete{background:var(--danger);color:#fff;margin-left:8px}
  .btn-add{background:var(--accent);color:#0f172a;margin-top:10px;width:100%}
  .btn-del-sec{background:transparent;color:var(--danger);border:1px solid var(--danger);
    padding:2px 6px;border-radius:4px;font-size:0.7rem;margin-left:auto}
  .btn-check-all{background:var(--accent2);color:#0f172a;margin-bottom:8px;width:100%;
    padding:8px;border-radius:6px;font-weight:bold;border:none;cursor:pointer}

  .adhoc-section{margin-top:24px}
  .adhoc-section h3{margin-bottom:12px;font-size:1.05rem;color:var(--accent2)}
  .adhoc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .adhoc-card{background:var(--card);padding:12px;border-radius:12px;border:1px solid var(--border)}
  .adhoc-card h4{margin:0 0 8px 0;font-size:0.95rem;color:var(--text)}
  .adhoc-textarea{width:100%;min-height:80px;background:var(--input-bg);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:10px;font-family:inherit;resize:vertical}
  .notes-section{background:var(--card);padding:16px;border-radius:14px;border:1px solid var(--border);margin-top:24px}
  .notes-section h3{margin:0 0 10px 0;font-size:1.05rem;color:var(--accent2)}
  .notes-textarea{width:100%;min-height:100px;background:var(--input-bg);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:12px;font-family:inherit;resize:vertical}

  footer{position:fixed;bottom:0;left:0;right:0;background:#0b1220;padding:12px 16px;display:flex;
    gap:10px;border-top:1px solid var(--border);z-index:20;flex-wrap:wrap}
  button.main-btn{flex:1;padding:12px;border:none;border-radius:10px;font-weight:600;font-size:0.9rem;
    cursor:pointer;background:var(--border);color:var(--text);transition:.2s}
  button.main-btn:active{opacity:.8}
  .btn-primary{background:var(--accent2)!important;color:#0f172a!important}
  .btn-danger{background:var(--danger)!important;color:#fff!important}
  .badge-done{font-size:0.7rem;background:var(--accent);color:#0f172a;padding:2px 6px;border-radius:5px;
    font-weight:700;display:none}
  .section.complete .badge-done{display:inline-block}

  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);
    z-index:100;flex-direction:column}
  .modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px;
    background:var(--card);border-bottom:1px solid var(--border)}
  .modal-header h2{margin:0;font-size:1.2rem}
  .modal-body{padding:16px;overflow-y:auto;flex:1}
  .btn-close{background:var(--danger);color:#fff;border:none;padding:8px 12px;border-radius:6px;
    font-weight:bold;cursor:pointer}

  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .gallery-item{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--border);
    display:flex;flex-direction:column}
  .gallery-item img{width:100%;height:120px;object-fit:cover;cursor:pointer}
  .gallery-item-info{padding:8px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
  .gallery-item-title{font-size:0.85rem;font-weight:bold;margin-bottom:8px;word-wrap:break-word}
  .gallery-item-actions{display:flex;gap:6px}
  .gallery-item-actions button{flex:1;font-size:0.7rem;padding:4px}

  #shiftLogTable{width:100%;border-collapse:collapse;font-size:0.82rem}
  #shiftLogTable th,#shiftLogTable td{padding:8px 6px;border-bottom:1px solid var(--border);
    text-align:left;vertical-align:top;white-space:nowrap}
  #shiftLogTable th{background:#243447;font-size:0.72rem;color:var(--muted);
    text-transform:uppercase;letter-spacing:.03em}
  #shiftLogTable tr:hover td{background:#1a2538}
  #shiftLogTable td.notes-cell{white-space:normal;max-width:180px;font-size:0.78rem;color:var(--muted)}
  #shiftLogTable td.num{font-variant-numeric:tabular-nums;text-align:right}
  .sl-ph-badge{display:inline-block;font-size:0.65rem;background:var(--warn);color:#0f172a;
    padding:1px 5px;border-radius:4px;font-weight:700}
  .sl-overnight{color:var(--accent2);font-size:0.7rem}
  .sl-summary-row{display:flex;justify-content:space-between;padding:3px 0;font-size:0.88rem}
  .sl-summary-row.total{border-top:1px solid var(--border);margin-top:8px;padding-top:8px;
    font-weight:bold;color:var(--accent);font-size:1rem}
  .sl-summary-row .val{font-variant-numeric:tabular-nums}

  @media print{
    body{background:#fff;color:#000;padding:0}
    header,.progress-wrap,footer,.top-bar,.adhoc-section,.notes-section,.btn-sm,.btn-delete,
    .btn-add,.btn-del-sec,.arrow,.shift-toggle,.btn-check-all,.ramadhan-countdown{display:none!important}
    .section{border:1px solid #ccc;page-break-inside:avoid;margin-bottom:15px;background:#fff}
    .section-head{background:#eee!important;color:#000}
    .section-body{display:block!important}
    .task label{color:#000!important;text-decoration:none!important}
    .note{color:#555!important}
    input[type="checkbox"]{border:2px solid #000!important}
    input[type="checkbox"]:checked::after{color:#000!important}
    body.sl-printing > *:not(#shiftLogModal){display:none!important}
    body.sl-printing #shiftLogModal{display:block!important;position:static;background:#fff;padding:16px}
    body.sl-printing #shiftLogModal .modal-header .btn-close,
    body.sl-printing #shiftLogModal .btn-tool,
    body.sl-printing #shiftLogModal #shiftLogForm{display:none!important}
    body.sl-printing #shiftLogModal *{color:#000!important}
    body.sl-printing #shiftLogTable th{background:#eee!important}
    body.sl-printing #shiftLogTable td,
    body.sl-printing #shiftLogTable th{border:1px solid #ccc!important}
    body.sl-printing #shiftLogSummary{border:1px solid #ccc}
    body.sl-printing .sl-summary-row.total{color:#000}
    body.sl-printing .sl-ph-badge{background:#eee!important;border:1px solid #999}
    body.sl-printing #shiftLogTable th:nth-last-child(-n+2),
    body.sl-printing #shiftLogTable td:nth-last-child(-n+2){display:none!important}
    @page{margin:12mm}
  }
  #slToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:#0f172a;padding:12px 24px;border-radius:10px;font-weight:700;
    font-size:0.95rem;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:200;white-space:nowrap}
  #slToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #slToast.error{background:var(--danger);color:#fff}

  .sync-status{font-size:0.7rem;padding:2px 8px;border-radius:10px;background:var(--border);color:var(--muted)}
  .sync-status.ok{background:var(--accent);color:#0f172a}
  .sync-status.err{background:var(--danger);color:#fff}
</style>
</head>
<body>

<div class="top-bar">
  <div style="font-weight:bold;font-size:1.1rem">🕌 Noja Masjid</div>
  <div class="btn-group">
    <span class="sync-status" id="syncStatus">local</span>
    <button class="btn-tool btn-log" onclick="openShiftLog()">📅 Shift Log</button>
    <button class="btn-tool btn-gallery" onclick="openGallery()">📸 Gallery</button>
    <button class="btn-tool btn-sync" onclick="pushToCloud(true)" title="Upload to Supabase">☁️ Sync</button>
    <button class="btn-tool" onclick="backupJSON()" title="Backup JSON">📥</button>
    <button class="btn-tool" onclick="document.getElementById('restoreFile').click()" title="Restore JSON">📤</button>
    <button class="btn-tool" onclick="window.print()" title="Print / PDF">🖨️</button>
  </div>
  <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreJSON(this)">
</div>

<div class="shift-toggle">
  <button class="shift-btn active" id="shiftMorningBtn" onclick="setShift('morning')">🌅 Morning Shift</button>
  <button class="shift-btn" id="shiftEveningBtn" onclick="setShift('evening')">🌙 Evening Shift</button>
</div>

<header>
  <h1 id="title">Noja Daily Procedure</h1>
  
  <!-- NEW RAMADHAN COUNTDOWN -->
  <div class="ramadhan-countdown">
    <h3>🌙 Countdown to Ramadhan</h3>
    <div class="days" id="ramadhanDays">--</div>
    <div style="font-size:0.75rem;color:var(--muted);margin-top:4px">Estimated: 8 Feb 2027</div>
  </div>

  <div class="date-display" id="dateDisplay">--</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="progress-text" id="progressText">0 / 0 completed</div>
</div>

<div id="sections"></div>

<div class="adhoc-section">
  <h3>📌 Weekly Tasks</h3>
  <div class="adhoc-grid" id="adhocGrid"></div>
</div>

<div class="notes-section">
  <h3>📝 Personal Notes</h3>
  <textarea class="notes-textarea" id="mainNotes" placeholder="Write notes here..."></textarea>
</div>

<footer>
  <button class="main-btn" id="btnExpandAll" onclick="toggleExpandAll()">Expand All</button>
  <button class="main-btn btn-primary" id="btnEdit" onclick="toggleEditMode()">✏️ Edit</button>
  <button class="main-btn btn-danger" onclick="resetAll()">Reset</button>
</footer>

<!-- Gallery Modal -->
<div id="galleryModal" class="modal">
  <div class="modal-header">
    <h2>📸 Reference Gallery</h2>
    <button class="btn-close" onclick="closeGallery()">Close</button>
  </div>
  <div class="modal-body">
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn-tool btn-sync" style="flex:1;padding:12px;font-size:.9rem"
        onclick="triggerGalleryUpload(true)">📷 Camera</button>
      <button class="btn-tool btn-sync" style="flex:1;padding:12px;font-size:.9rem"
        onclick="triggerGalleryUpload(false)">🖼️ Gallery</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<!-- Full Image Viewer -->
<div id="imgModal" class="modal" style="justify-content:center;align-items:center;background:rgba(0,0,0,.95)"
  onclick="if(event.target===this) this.style.display='none'">
  <img id="imgModalSrc" style="max-width:100%;max-height:100%;object-fit:contain">
</div>

<!-- Shift Log Modal -->
<div id="slToast"></div>
<div id="shiftLogModal" class="modal">
  <div class="modal-header">
    <h2>📅 Shift Log</h2>
    <button class="btn-close" onclick="closeShiftLog()">✖</button>
  </div>
  <div class="modal-body">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">
      <button class="btn-tool" onclick="shiftLogPrevMonth()" style="font-size:1rem;padding:8px 14px">◀</button>
      <div id="shiftLogMonthLabel" style="font-weight:bold;font-size:1.05rem;text-align:center;flex:1"></div>
      <button class="btn-tool" onclick="shiftLogNextMonth()" style="font-size:1rem;padding:8px 14px">▶</button>
    </div>

    <div id="shiftLogForm" style="background:var(--input-bg);border:1px solid var(--border);
      border-radius:10px;padding:12px;margin-bottom:14px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
        <div><label style="font-size:.75rem;color:var(--muted)">Date</label>
          <input type="date" id="slDate" class="edit-input" style="margin-bottom:0"></div>
        <div><label style="font-size:.75rem;color:var(--muted)">Shift Type</label>
          <select id="slType" class="edit-input" style="margin-bottom:0" onchange="shiftLogOnTypeChange()">
            <option value="morning">Morning</option>
            <option value="evening" selected>Evening</option>
            <option value="adhoc">Adhoc</option>
          </select></div>
        <div><label style="font-size:.75rem;color:var(--muted)">Start</label>
          <input type="time" id="slStart" class="edit-input" style="margin-bottom:0" value="17:30"></div>
        <div><label style="font-size:.75rem;color:var(--muted)">End</label>
          <input type="time" id="slEnd" class="edit-input" style="margin-bottom:0" value="22:30"></div>
        <div><label style="font-size:.75rem;color:var(--muted)">OT (hrs)</label>
          <input type="number" id="slOT" class="edit-input" style="margin-bottom:0" min="0" step="0.25" value="0"></div>
        <div style="display:flex;align-items:flex-end;padding-bottom:4px">
          <label style="display:flex;align-items:center;gap:6px;font-size:.85rem">
            <input type="checkbox" id="slPH" style="width:18px;height:18px">
            <span>Public Holiday</span>
          </label></div>
      </div>
      <div style="margin-top:8px">
        <label style="font-size:.75rem;color:var(--muted)">Reason</label>
        <input type="text" id="slReason" class="edit-input" style="margin-bottom:0">
      </div>
      <div style="margin-top:8px">
        <label style="font-size:.75rem;color:var(--muted)">Notes</label>
        <input type="text" id="slNotes" class="edit-input" style="margin-bottom:0">
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-sm" style="flex:1;background:var(--accent);color:#0f172a;padding:10px;font-size:.9rem"
          id="btnSaveEntry" onclick="shiftLogSaveEntry()">💾 Save</button>
        <button class="btn-sm" style="flex:1;background:var(--border);color:var(--text);padding:10px;
          font-size:.9rem;display:none" id="btnCancelEdit" onclick="shiftLogCancelEdit()">✖ Cancel</button>
      </div>
    </div>

    <div style="overflow-x:auto;margin-bottom:14px">
      <table id="shiftLogTable">
        <thead id="shiftLogThead"></thead>
        <tbody id="shiftLogTbody"></tbody>
      </table>
    </div>

    <div id="shiftLogSummary" style="background:var(--card);border:1px solid var(--border);
      border-radius:10px;padding:14px;margin-bottom:14px"></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-tool btn-sync" style="flex:1;padding:10px" onclick="shiftLogPrint()">🖨️ Print / PDF</button>
      <button class="btn-tool" style="flex:1;padding:10px" onclick="shiftLogCSV()">📄 CSV</button>
      <button class="btn-tool" style="flex:1;padding:10px" onclick="shiftLogExportJSON()">📥 Export JSON</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// CLOUDFLARE WORKER PROXY
// ==========================================
const WORKER_URL = "https://noja-dzul.dzul1234.workers.dev"; 

let sbReady = true;
let pushTimer = null;

function initSupabase() {
  setSyncStatus("ok", "cloud");
}

function setSyncStatus(cls, text) {
  const el = document.getElementById("syncStatus");
  if (!el) return;
  el.className = "sync-status " + cls;
  el.textContent = text;
}

function buildStatePayload() {
  return {
    tasksMorning, tasksEvening, checks: checksData, adhoc: adhocData,
    notes: notesData, gallery: galleryData, shiftLog: shiftLogData,
    _savedAt: new Date().toISOString()
  };
}

function applyStatePayload(d) {
  if (!d) return;
  if (Array.isArray(d.tasksMorning)) tasksMorning = d.tasksMorning;
  if (Array.isArray(d.tasksEvening)) tasksEvening = d.tasksEvening;
  if (d.checks) checksData = d.checks;
  if (d.adhoc) adhocData = d.adhoc;
  if (typeof d.notes === "string") notesData = d.notes;
  if (Array.isArray(d.gallery)) galleryData = d.gallery;
  if (Array.isArray(d.shiftLog)) shiftLogData = d.shiftLog;

  localStorage.setItem(K_TASKS_M, JSON.stringify(tasksMorning));
  localStorage.setItem(K_TASKS_E, JSON.stringify(tasksEvening));
  localStorage.setItem(K_CHECKS, JSON.stringify(checksData));
  localStorage.setItem(K_ADHOC, JSON.stringify(adhocData));
  localStorage.setItem(K_NOTES, notesData);
  localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
  localStorage.setItem(K_SHIFTLOG, JSON.stringify(shiftLogData));
}

async function pullFromCloud(showToast) {
  if (!sbReady) { if (showToast) slToast("Cloud not configured", true); return false; }
  try {
    setSyncStatus("", "syncing…");
    const res = await fetch(WORKER_URL + "?t=" + Date.now(), { method: "GET" });
    if (!res.ok) throw new Error("Network error");
    const data = await res.json();
    
    if (data && data.length > 0 && data[0].data) {
      applyStatePayload(data[0].data);
      document.getElementById("mainNotes").value = notesData;
      renderTexts(); renderTasks(); renderAdhoc(); renderGallery();
      setSyncStatus("ok", "cloud ✓");
      if (showToast) slToast("☁️ Data loaded from Cloudflare");
      return true;
    } else {
      setSyncStatus("ok", "cloud (empty)");
      if (showToast) slToast("Cloud is empty — press ☁️ Sync to upload", true);
      return false;
    }
  } catch (e) {
    console.error("Pull fail:", e);
    setSyncStatus("err", "err");
    if (showToast) slToast("❌ Pull failed: " + e.message, true);
    return false;
  }
}

async function pushToCloud(showToast) {
  if (!sbReady) { if (showToast) slToast("Cloud not configured", true); return; }
  try {
    setSyncStatus("", "saving…");
    const payload = {
        id: "main",
        data: buildStatePayload(),
        updated_at: new Date().toISOString()
    };
    const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("Network error");
    setSyncStatus("ok", "cloud ✓");
    if (showToast) slToast("✅ Data uploaded to Cloudflare");
  } catch (e) {
    console.error("Push fail:", e);
    setSyncStatus("err", "err");
    if (showToast) slToast("❌ Push failed: " + e.message, true);
  }
}

function schedulePush() {
  if (!sbReady) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushToCloud(false), 1500);
}

// This safety function is applied to EVERY task as it renders
// If it finds an object, it extracts the text. If it's a string, it uses it.
function safeText(val) {
  if (val === null || val === undefined) return "";
  if (typeof val === "object") {
    return val.en || val.ms || Object.values(val)[0] || "Task";
  }
  return String(val);
}

function cleanOldData(data) {
  if (!Array.isArray(data)) return data;
  return data.map(sec => {
    let title = safeText(sec.title) || "Section";
    let tasks = sec.tasks || [];
    tasks = tasks.map(t => {
      return { t: safeText(t.t), n: safeText(t.n) };
    });
    return { time: sec.time, title: title, tasks: tasks };
  });
}

  document.getElementById("progressText").textContent = `${done} / ${all} completed (${Math.round(pct)}%)`;

function triggerGalleryUpload(useCamera){
  const input = document.createElement("input");
  input.type="file"; input.accept="image/*";
  if (useCamera) input.setAttribute("capture","environment");
  input.click();
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const title = prompt("Enter image title (e.g: Daikin Aircon Panel):"); if (!title) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement("canvas");
        const MAX = 1000;
        const scale = Math.min(1, MAX/img.width);
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        const base64 = canvas.toDataURL("image/jpeg",0.75);

        const newItem = { id: Date.now().toString(), title, base64 };
        galleryData.push(newItem);
        localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
        renderGallery();
        schedulePush();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
}

  const item = galleryData.find(g=>g.id===id); if (!item) return;

// ==========================================
// SHIFT LOG
// ==========================================
let slEditId = null;
let slViewDate = new Date();

function slSaveStorage(){ localStorage.setItem(K_SHIFTLOG, JSON.stringify(shiftLogData)); schedulePush(); }
const slPad = n => String(n).padStart(2,"0");
function slISOtoDisplay(iso){
  if (!iso) return "";
  const [y,m,d] = iso.split("-");
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${d} ${M[parseInt(m,10)-1]} ${y}`;
}
function slDayName(iso){
  const d = new Date(iso+"T00:00:00");
  return ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][(d.getDay()+6)%7];
}
function slHours(start,end){
  if (!start||!end) return 0;
  const [sh,sm]=start.split(":").map(Number), [eh,em]=end.split(":").map(Number);
  let mins = (eh*60+em)-(sh*60+sm);
  if (mins<=0) mins += 24*60;
  return mins/60;
}
function slIsOvernight(s,e){
  if (!s||!e) return false;
  const [sh,sm]=s.split(":").map(Number), [eh,em]=e.split(":").map(Number);
  return (eh*60+em) <= (sh*60+sm);
}
function slEntriesForMonth(y,m){
  const ym = `${y}-${slPad(m+1)}`;
  return shiftLogData.filter(e=>e.date.startsWith(ym))
    .sort((a,b)=> a.date===b.date ? a.start.localeCompare(b.start) : a.date.localeCompare(b.date));
}
function openShiftLog(){
  document.getElementById("shiftLogModal").style.display="flex";
  slViewDate = new Date(); slResetForm(); renderShiftLog();
}
function closeShiftLog(){ document.getElementById("shiftLogModal").style.display="none"; slEditId=null; }
function shiftLogPrevMonth(){ slViewDate.setMonth(slViewDate.getMonth()-1); renderShiftLog(); }
function shiftLogNextMonth(){ slViewDate.setMonth(slViewDate.getMonth()+1); renderShiftLog(); }
function shiftLogOnTypeChange(){
  const type = document.getElementById("slType").value;
  const s=document.getElementById("slStart"), e=document.getElementById("slEnd");
  if (type==="morning"){ s.value="04:30"; e.value="09:00"; }
  else if (type==="evening"){ s.value="17:30"; e.value="22:30"; }
  else { s.value=""; e.value=""; }
}
function slResetForm(){
  slEditId=null;
  document.getElementById("slDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("slType").value = "evening";
  shiftLogOnTypeChange();
  document.getElementById("slOT").value = 0;
  document.getElementById("slPH").checked = false;
  document.getElementById("slReason").value = "";
  document.getElementById("slNotes").value = "";
  document.getElementById("btnCancelEdit").style.display = "none";
}
function shiftLogSaveEntry(){
  const date=document.getElementById("slDate").value;
  const type=document.getElementById("slType").value;
  const start=document.getElementById("slStart").value;
  const end=document.getElementById("slEnd").value;
  const ot=parseFloat(document.getElementById("slOT").value)||0;
  const ph=document.getElementById("slPH").checked;
  const reason=document.getElementById("slReason").value.trim();
  const notes=document.getElementById("slNotes").value.trim();
  if (!date||!start||!end){ alert("Please fill date, start and end times."); return; }
  const wasEditing = !!slEditId;
  if (slEditId){
    const idx = shiftLogData.findIndex(e=>e.id===slEditId);
    if (idx>=0) shiftLogData[idx] = {id:slEditId,date,type,start,end,ot,ph,reason,notes};
  } else {
    shiftLogData.push({id:Date.now().toString(),date,type,start,end,ot,ph,reason,notes});
  }
  slSaveStorage(); slResetForm(); renderShiftLog();
  const total = (slHours(start,end)+ot).toFixed(2);
  slToast((wasEditing?"✏️ Updated: ":"✅ Saved: ")+slISOtoDisplay(date)+" · "+total+"h");
}
function shiftLogEdit(id){
  const e = shiftLogData.find(x=>x.id===id); if (!e) return;
  slEditId = id;
  document.getElementById("slDate").value = e.date;
  document.getElementById("slType").value = e.type;
  document.getElementById("slStart").value = e.start;
  document.getElementById("slEnd").value = e.end;
  document.getElementById("slOT").value = e.ot||0;
  document.getElementById("slPH").checked = !!e.ph;
  document.getElementById("slReason").value = e.reason||"";
  document.getElementById("slNotes").value = e.notes||"";
  document.getElementById("btnCancelEdit").style.display = "block";
  document.getElementById("shiftLogForm").scrollIntoView({behavior:"smooth",block:"center"});
}
function shiftLogCancelEdit(){ slResetForm(); }
function shiftLogDelete(id){
  if (!confirm("Delete this entry?")) return;
  const removed = shiftLogData.find(e=>e.id===id);
  shiftLogData = shiftLogData.filter(e=>e.id!==id);
  slSaveStorage(); renderShiftLog();
  slToast("🗑️ Deleted: "+(removed?slISOtoDisplay(removed.date):"entry"), true);
}
function renderShiftLog(){
  if (document.getElementById("shiftLogModal").style.display !== "flex") return;
  const year = slViewDate.getFullYear(), month = slViewDate.getMonth();
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("shiftLogMonthLabel").textContent = M[month] + " " + year;

  document.getElementById("shiftLogThead").innerHTML = `<tr>
    <th>Date</th><th>Day</th><th>Shift</th>
    <th>Start</th><th>End</th>
    <th style="text-align:right">Base Hrs</th>
    <th style="text-align:right">OT Hrs</th>
    <th style="text-align:right">Total</th>
    <th>PH</th><th>Reason</th><th>Notes</th><th></th><th></th></tr>`;

  const tbody = document.getElementById("shiftLogTbody");
  const entries = slEntriesForMonth(year,month);
  tbody.innerHTML = "";
  if (entries.length===0) {
    tbody.innerHTML = `<tr><td colspan="13" style="text-align:center;color:var(--muted);padding:20px">No entries this month. Fill the form above to add.</td></tr>`;
  } else {
    entries.forEach(e=>{
      const base = slHours(e.start,e.end), total = base + (e.ot||0);
      const overnight = slIsOvernight(e.start,e.end) ? ' <span class="sl-overnight">+1d</span>' : "";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(slISOtoDisplay(e.date))}</td>
        <td>${esc(slDayName(e.date))}</td>
        <td>${esc(e.type.charAt(0).toUpperCase()+e.type.slice(1))}</td>
        <td>${esc(e.start)}</td>
        <td>${esc(e.end)}${overnight}</td>
        <td class="num">${base.toFixed(2)}</td>
        <td class="num">${(e.ot||0).toFixed(2)}</td>
        <td class="num"><strong>${total.toFixed(2)}</strong></td>
        <td>${e.ph?'<span class="sl-ph-badge">PH</span>':''}</td>
        <td class="notes-cell">${esc(e.reason||"")}</td>
        <td class="notes-cell">${esc(e.notes||"")}</td>
        <td><button class="btn-sm" style="background:var(--accent2);color:#0f172a"
          onclick="shiftLogEdit('${esc(e.id)}')">✏️</button></td>
        <td><button class="btn-sm btn-delete" onclick="shiftLogDelete('${esc(e.id)}')">🗑️</button></td>`;
      tbody.appendChild(tr);
    });
  }
  renderShiftLogSummary(entries);
}
function renderShiftLogSummary(entries){
  let mC=0,mB=0,eC=0,eB=0,aC=0,aB=0,tOT=0,tBase=0,phC=0;
  entries.forEach(e=>{
    const b = slHours(e.start,e.end);
    tBase+=b; tOT+=(e.ot||0); if (e.ph) phC++;
    if (e.type==="morning"){mC++;mB+=b;} else if (e.type==="evening"){eC++;eB+=b;} else {aC++;aB+=b;}
  });
  const total = tBase+tOT, days = entries.length, avg = days? total/days : 0;
  const line = (l,v)=>`<div class="sl-summary-row"><span>${l}</span><span class="val">${v}</span></div>`;
  let html = `<div style="font-weight:bold;margin-bottom:8px;color:var(--accent2)">Working days: ${days}</div>`;
  if (mC) html += line("&nbsp;&nbsp;Morning", `${mC} shifts · ${mB.toFixed(2)}h · avg ${(mB/mC).toFixed(2)}`);
  if (eC) html += line("&nbsp;&nbsp;Evening", `${eC} shifts · ${eB.toFixed(2)}h · avg ${(eB/eC).toFixed(2)}`);
  if (aC) html += line("&nbsp;&nbsp;Adhoc", `${aC} shifts · ${aB.toFixed(2)}h · avg ${(aB/aC).toFixed(2)}`);
  html += line("Total base hours", tBase.toFixed(2)+" h");
  html += line("Total OT hours", tOT.toFixed(2)+" h");
  html += `<div class="sl-summary-row total"><span>TOTAL HOURS</span><span class="val">${total.toFixed(2)} h</span></div>`;
  html += line("Avg hrs / day", avg.toFixed(2)+" h");
  html += line("Public Holiday shifts", phC);
  let ytdS=0, ytdH=0;
  shiftLogData.forEach(e=>{
    if (parseInt(e.date.slice(0,4),10)===slViewDate.getFullYear()){ ytdS++; ytdH+=slHours(e.start,e.end)+(e.ot||0); }
  });
  html += `<div style="margin-top:10px;font-size:.75rem;color:var(--muted);text-align:center">YTD ${slViewDate.getFullYear()}: ${ytdH.toFixed(1)}h · ${ytdS} shifts</div>`;
  document.getElementById("shiftLogSummary").innerHTML = html;
}
function shiftLogCSV(){
  const y=slViewDate.getFullYear(), m=slViewDate.getMonth();
  const entries = slEntriesForMonth(y,m);
  if (entries.length===0){ alert("No entries this month."); return; }
  const rows = [["Date","Day","Shift","Start","End","Base Hrs","OT Hrs","Total","PH","Reason","Notes"]];
  entries.forEach(e=>{
    const b = slHours(e.start,e.end);
    rows.push([slISOtoDisplay(e.date),slDayName(e.date),e.type,e.start,e.end,
      b.toFixed(2),(e.ot||0).toFixed(2),(b+(e.ot||0)).toFixed(2),
      e.ph?"PH":"",e.reason||"",e.notes||""]);
  });
  const sB = entries.reduce((a,e)=>a+slHours(e.start,e.end),0);
  const sO = entries.reduce((a,e)=>a+(e.ot||0),0);
  rows.push(["","","","","TOTAL HOURS",sB.toFixed(2),sO.toFixed(2),(sB+sO).toFixed(2),"","",""]);
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href=url;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  a.download=`ShiftLog_${M[m]}_${y}.csv`; a.click(); URL.revokeObjectURL(url);
}
function slToast(msg, isErr){
  const el = document.getElementById("slToast"); if (!el) return;
  el.textContent = msg; el.className = "show"+(isErr?" error":"");
  clearTimeout(el._t); el._t = setTimeout(()=>el.className="",2200);
}
function shiftLogExportJSON(){
  const y=slViewDate.getFullYear(), m=slViewDate.getMonth();
  const entries = slEntriesForMonth(y,m);
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const blob = new Blob([JSON.stringify({month:`${M[m]}_${y}`,entries},null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href=url; a.download=`ShiftLog_${M[m]}_${y}.json`; a.click(); URL.revokeObjectURL(url);
}
function shiftLogPrint(){
  document.body.classList.add("sl-printing");
  setTimeout(()=>{ window.print(); setTimeout(()=>document.body.classList.remove("sl-printing"),500); },100);
}

// ==========================================
// BACKUP / RESTORE (LOCAL JSON)
// ==========================================
function backupJSON(){
  const data = buildStatePayload();
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href=url; a.download=`NojaMasjid_Backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  alert("Backup downloaded successfully.");
}
function restoreJSON(input){
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.tasksMorning || !d.tasksEvening) throw new Error("invalid");
      applyStatePayload(d);
      alert("Data restored. Page will reload.");
      location.reload();
    } catch { alert("Invalid backup file."); }
  };
  reader.readAsText(file); input.value="";
}

// ==========================================
// CLOCK & COUNTDOWN
// ==========================================
function tick(){
  const now = new Date();
  document.getElementById("dateDisplay").textContent =
    now.toLocaleDateString("en-GB",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  document.getElementById("clock").textContent = now.toLocaleTimeString("en-GB",{hour12:false});
  
  // Ramadhan Countdown (8 Feb 2027)
  const ramadhanDate = new Date("2027-02-08T00:00:00");
  const diffTime = ramadhanDate - now;
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  
  const el = document.getElementById("ramadhanDays");
  if (diffDays > 0) {
    el.innerHTML = `${diffDays} <span>days left</span>`;
  } else if (diffDays === 0) {
    el.innerHTML = `Alhamdulillah, Ramadhan is here!`;
  } else {
    el.innerHTML = `Ramadhan Mubarak`;
  }
}
setInterval(tick,1000);

// ==========================================
// INIT
// ==========================================
async function init(){
  document.getElementById("mainNotes").value = notesData;
  renderTexts(); renderTasks(); renderAdhoc(); tick();
  initSupabase();
  if (sbReady) await pullFromCloud(false);
  setInterval(()=>{ if (sbReady && !isEditMode) pullFromCloud(false); }, 60000);
}
init();
</script>

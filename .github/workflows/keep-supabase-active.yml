name: Keep Supabase Active

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloudflare Worker
        run: |
          curl -X POST "https://noja-dzul.dzul1234.workers.dev" \
            -H "Content-Type: application/json" \
            -H "x-master-key: master123" \
            -d '{"id": "main", "data": {"ping": "active"}, "updated_at": "2026-11-16T00:00:00Z"}'
